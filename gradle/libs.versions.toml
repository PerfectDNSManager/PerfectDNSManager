[versions]
agp = "8.13.2"
coreKtx = "1.16.0"
kotlin = "2.2.21"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }

androidx-appcompat-appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.1" }
androidx-recyclerview-recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }
com-google-code-gson-gson = { module = "com.google.code.gson:gson", version = "2.15.0" }
com-squareup-okhttp3-okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.4.0" }
dnsjava-dnsjava = { module = "dnsjava:dnsjava", version = "3.7.1" }
org-slf4j-slf4j-nop = { module = "org.slf4j:slf4j-nop", version = "1.7.36" }
org-bouncycastle-bcpkix-jdk18on = { module = "org.bouncycastle:bcpkix-jdk18on", version = "1.86" }
org-bouncycastle-bcprov-jdk18on = { module = "org.bouncycastle:bcprov-jdk18on", version = "1.86" }
org-conscrypt-conscrypt-android = { module = "org.conscrypt:conscrypt-android", version = "2.8.0" }
